# nest-picker configuration (/etc/nest-picker.conf). Plain KEY=VALUE, no spaces
# around '='. Restart with:  killall nest-picker   (the supervisor relaunches it)

# MQTT broker (plain TCP; TLS is not supported)
MQTT_HOST=192.168.1.110
MQTT_PORT=1883
MQTT_USER=
MQTT_PASS=
# Publishes <MQTT_TOPIC>/color, <MQTT_TOPIC>/sound and availability on <MQTT_TOPIC>/status
MQTT_TOPIC=nest/picker
# Leave empty to use nest-picker-<serial>
MQTT_CLIENT_ID=
MQTT_RETAIN=1
# Minimum ms between publishes while the ring is spinning
PUBLISH_MIN_MS=100

# Display
BACKLIGHT=80
# Turn the screen off after this many idle seconds (0 = never)
SLEEP_SECS=60

# Ring feel: degrees of hue per ring count, ring counts per sound on the sound page
HUE_STEP=1.0
SOUND_STEP=20
RING_INVERT=0
BEEP=1

# Hue and Hatch sound id used on first boot (later the last choice is restored)
START_H=30
START_SOUND=0

# Supervisor timing (seconds)
BOOT_WAIT=5
NET_WAIT=60

# Time zone (IANA name from /usr/share/zoneinfo on the Nest). Empty = the Nest's
# own setting (currently America/Chicago, set by the stock software).
TIMEZONE=America/Los_Angeles

# Night mode: during these hours, waking the screen shows the night animation
# instead of the picker, and the ring/press only keep it awake. HH:MM-HH:MM in
# TIMEZONE; may wrap past midnight. Empty = off.
# Push the animation with:  ./install.sh <host> --night-gif my.gif
NIGHT_MODE=21:00-06:30
NIGHT_ANIM=/media/data/nest-picker/night.anim
# Optional night overrides (empty = BACKLIGHT / SLEEP_SECS)
NIGHT_BACKLIGHT=40
NIGHT_SLEEP_SECS=10
