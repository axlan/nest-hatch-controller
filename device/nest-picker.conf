# nest-picker configuration (/etc/nest-picker.conf). Plain KEY=VALUE, no spaces
# around '='. Restart with:  killall nest-picker   (the supervisor relaunches it)

# MQTT broker (plain TCP; TLS is not supported)
MQTT_HOST=192.168.1.110
MQTT_PORT=1883
MQTT_USER=
MQTT_PASS=
# Color is published to <MQTT_TOPIC>/color, availability to <MQTT_TOPIC>/status
MQTT_TOPIC=nest/picker
# Leave empty to use nest-picker-<serial>
MQTT_CLIENT_ID=
MQTT_RETAIN=1
# Minimum ms between publishes while the ring is spinning
PUBLISH_MIN_MS=100

# Display
BACKLIGHT=80
# Turn the screen off after this many idle seconds (0 = never)
SLEEP_SECS=300

# Ring feel: degrees of hue / percent of sat+brightness per ring count
HUE_STEP=1.0
PCT_STEP=0.5
RING_INVERT=0
BEEP=1

# Color used on first boot (later the last color is restored)
START_H=30
START_S=100
START_V=100

# Supervisor timing (seconds)
BOOT_WAIT=5
NET_WAIT=60
