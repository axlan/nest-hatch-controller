; ESP32-S3 Hatch Rest BLE bridge.
;   pio run -t upload                                   (USB, first flash)
;   pio run -t upload --upload-port hatch-ble-bridge.local  (OTA afterwards)
;   pio device monitor
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 8 MB flash: two 3.3 MB OTA app slots (use min_spiffs.csv on 4 MB boards; it fits at ~95%)
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps =
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
    h2zero/NimBLE-Arduino@^2.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Serial over the S3's native USB port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Broker used until one is configured (WiFi portal or `hatch-ble-bridge-setup setup-mqtt`)
    -DDEFAULT_MQTT_HOST=\"192.168.1.110\"
build_unflags =
    -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
